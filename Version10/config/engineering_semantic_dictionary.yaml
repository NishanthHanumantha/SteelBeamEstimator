# Pattern-based meanings for callouts (regex against normalized notation)
pattern_meanings:
  - pattern: "^\\d+L-[YyRrTt]\\d+@\\d+"
    engineering_meaning: STIRRUP
    category: SPACING
    engineering_role: STIRRUP
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Multi-leg stirrup callout"

  - pattern: "^[YyRrTt]\\d+@\\d+"
    engineering_meaning: STIRRUP
    category: SPACING
    engineering_role: STIRRUP
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Stirrup spacing callout"

  - pattern: "^\\d+-[YyRrTt]\\d+\\+\\d+[YyRrTt]\\d+"
    engineering_meaning: TOP_MAIN
    category: QUANTITY
    engineering_role: MAIN_BAR
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Composite bar callout (regex-supported)"

  - pattern: "^\\d+-[YyRrTt]\\d+$"
    engineering_meaning: TOP_MAIN
    category: QUANTITY
    engineering_role: MAIN_BAR
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Standard N-YD bar callout (regex-supported)"

  - pattern: "^[YyRrTt]\\d+$"
    engineering_meaning: TOP_MAIN
    category: QUANTITY
    engineering_role: MAIN_BAR
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Grade-diameter notation"

  - pattern: "^\\(\\d+[xX~]\\d+\\)$"
    engineering_meaning: UNKNOWN
    category: GEOMETRY
    engineering_role: null
    position: null
    quantity_multiplier: 1
    priority: LOW
    description: "Beam section geometry label"

