# Nginx site — Version10 (Phase W.3). Upstream is Gunicorn on 127.0.0.1:8001.
# Rollback: restore nginx-v8-rollback.conf and reload nginx.

upstream steel_beam_estimator_app {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 256M;
    send_timeout 3600s;

    location /static/ {
        alias /opt/steel-beam-estimation/SteelBeamEstimator/Version10/webapp/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://steel_beam_estimator_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://steel_beam_estimator_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
