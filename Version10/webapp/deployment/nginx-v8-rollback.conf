# Captured from Lightsail 2026-08-24 — 8.9.5 / Version8 public upstream (127.0.0.1:8000).
# Restore this file to /etc/nginx/sites-available/steel-beam-estimator.conf then:
#   sudo nginx -t && sudo systemctl reload nginx

upstream steel_beam_estimator_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 256M;

    location /static/ {
        alias /opt/steel-beam-estimation/SteelBeamEstimator/Steel-Beam-Estimation/current_model/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://steel_beam_estimator_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    location = /health {
        proxy_pass http://steel_beam_estimator_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
