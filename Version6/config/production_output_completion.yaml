phase: "VB.1"
model_version: "6.6.0"
phase_name: "Production Output Completion"

input:
  l2_models: "Version6/data/output/PhaseL.2 - engineering_reinforcement_interpretation/beam_reinforcement_models.json"
  phase_i_dir: "Version6/data/output/phase_i"

output:
  base_dir: "Version6/data/output/Production_Output"
  workbooks:
    production: "Estimation_Output.xlsx"
    engineering_review: "Engineering_Review.xlsx"
    archive_dir: "Archive"
  json_reports:
    - "production_output_report.json"
    - "workbook_validation.json"
    - "steel_weight_summary.json"
    - "bbs_summary.json"
    - "workbook_statistics.json"
    - "engineering_totals.json"
    - "production_statistics.json"

engineering:
  steel_density_kg_m3: 7850.0
  development_length_factor: 40
  cover_mm: 40.0
  hook_multiple: 10
  standard: "IS 456:2000 / IS 2502:1963"
  supported_diameters: [8, 10, 12, 16, 20, 25, 32]

validation_rules:
  RULE_1: "Pipeline exits successfully"
  RULE_2: "Steel Weight > 0"
  RULE_3: "Workbook generated"
  RULE_4: "Estimator Output Workbook generated"
  RULE_5: "Engineering Review Workbook generated"
  RULE_6: "Archive Workbook generated"
  RULE_7: "Workbook validation passes"

worksheets:
  - "Project Header"
  - "General Notes"
  - "Beam Summary"
  - "Bar Bending Schedule"
  - "Steel Summary"
  - "Diameter Summary"
  - "Project Totals"
