# Engineering Intent Priority Table — Phase K.1.1
# Higher numeric priority = more dominant engineering intent.
# Priorities are configurable; do not hardcode in engine code.

model_version: "6.0.1"
phase: "Phase K.1.1"

priorities:
  SUPPLEMENTARY_DEVELOPMENT_LENGTH: 100
  SUPPLEMENTARY_ANCHORAGE: 95
  SUPPLEMENTARY_HOOK: 90
  SUPPLEMENTARY_CONTINUATION: 80
  SUPPLEMENTARY_SUPPORT_BAR: 70
  SUPPLEMENTARY_TERMINATION: 60
  SUPPLEMENTARY_CURTAILMENT: 50
  SUPPLEMENTARY_REINFORCEMENT: 40
  UNKNOWN: 0

merge_groups:
  - name: SUPPORT_REINFORCEMENT
    members:
      - SUPPLEMENTARY_DEVELOPMENT_LENGTH
      - SUPPLEMENTARY_ANCHORAGE
    result_category: SUPPORT_REINFORCEMENT
    resolution_rule: K.1.1.MERGE.SUPPORT_REINFORCEMENT
  - name: CONTINUOUS_SUPPORT_REINFORCEMENT
    members:
      - SUPPLEMENTARY_CONTINUATION
      - SUPPLEMENTARY_SUPPORT_BAR
    result_category: CONTINUOUS_SUPPORT_REINFORCEMENT
    resolution_rule: K.1.1.MERGE.CONTINUOUS_SUPPORT

mutual_exclusions:
  - [SUPPLEMENTARY_TERMINATION, SUPPLEMENTARY_CONTINUATION]
  - [SUPPLEMENTARY_TERMINATION, SUPPLEMENTARY_SUPPORT_BAR]

override_rules:
  - dominant: SUPPLEMENTARY_ANCHORAGE
    suppresses: SUPPLEMENTARY_TERMINATION
  - dominant: SUPPLEMENTARY_DEVELOPMENT_LENGTH
    suppresses: SUPPLEMENTARY_TERMINATION
  - dominant: SUPPLEMENTARY_CONTINUATION
    suppresses: SUPPLEMENTARY_TERMINATION

complement_rules:
  - source: SUPPLEMENTARY_HOOK
    complements: SUPPLEMENTARY_ANCHORAGE
  - source: SUPPLEMENTARY_HOOK
    complements: SUPPLEMENTARY_DEVELOPMENT_LENGTH
  - source: SUPPLEMENTARY_SUPPORT_BAR
    complements: SUPPLEMENTARY_CONTINUATION

require_rules:
  - source: SUPPLEMENTARY_DEVELOPMENT_LENGTH
    requires: SUPPLEMENTARY_HOOK
  - source: SUPPLEMENTARY_ANCHORAGE
    requires: SUPPLEMENTARY_HOOK

equivalent_pairs:
  - [SUPPLEMENTARY_DEVELOPMENT_LENGTH, SUPPLEMENTARY_ANCHORAGE]
