# Phase K.2.1 — Engineering Decision Validation configuration
# When enable is false, Phase K.2 behaves exactly as MODEL_VERSION 6.1.0.

model_version: "6.2.0"
phase: "Phase K.2.1"

enable: true
strict_validation: true
allow_warnings: true
minimum_score: 100
stop_on_invalid: true
export_validation_registry: true
export_statistics: true
fail_on_broken_traceability: true
fail_on_duplicate_execution: true
export_excel_report: true
