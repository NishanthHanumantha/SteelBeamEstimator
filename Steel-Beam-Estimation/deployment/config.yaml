# Phase D.4.1 — deployment parameters (placeholders only — do not commit secrets)
# Operators edit this file before running scripts on a Lightsail host.
# Scripts read these values via deployment/scripts/_common.sh

deployment_package_version: "D.4.1"

server_ip: "0.0.0.0"                          # Lightsail public IP (fill before deploy)
ssh_user: "ubuntu"                            # SSH login user on the instance
application_directory: "/opt/steel-beam-estimation"

# Path segments relative to application_directory (layout-independent)
# Mode A (fresh / flat package): leave repository_directory empty
# Mode B (monorepo checkout): repository_directory: SteelBeamEstimator
repository_directory: "SteelBeamEstimator"
project_directory: "Steel-Beam-Estimation"
model_directory: "current_model"

# Legacy aliases (still read if new keys are absent — D.4 backwards compatibility)
# app_subdirectory: "Steel-Beam-Estimation"
# model_subdirectory: "current_model"

github_repository: "https://github.com/NishanthHanumantha/SteelBeamEstimator.git"
branch: "main"
python_version: "3.12"
virtual_environment_name: ".venv"
gunicorn_service_name: "steel-beam-estimator"
nginx_site_name: "steel-beam-estimator"

# Optional runtime (referenced by gunicorn / nginx / systemd templates)
gunicorn_bind: "127.0.0.1:8000"
gunicorn_workers: 2
gunicorn_timeout: 3600
