# Nginx site — Steel Beam Reinforcement Estimation (Phase D.4)
# Independent from Concrete & Shuttering Estimator.
#
# Install (later, on server):
#   sudo cp steel-beam-estimator.conf /etc/nginx/sites-available/
#   sudo ln -sfn /etc/nginx/sites-available/steel-beam-estimator.conf \
#                /etc/nginx/sites-enabled/steel-beam-estimator.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace placeholders before go-live:
#   __SERVER_NAME__           e.g. estimator.example.com or _
#   __APP_ROOT__              e.g. /opt/steel-beam-estimation/Steel-Beam-Estimation
#   __GUNICORN_UPSTREAM__     e.g. 127.0.0.1:8000

upstream steel_beam_estimator_app {
    server __GUNICORN_UPSTREAM__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 256M;

    # Static assets from current_model (version-agnostic path)
    location /static/ {
        alias __APP_ROOT__/current_model/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://steel_beam_estimator_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Health check (used by packaging / later Lightsail validation)
    location = /health {
        proxy_pass http://steel_beam_estimator_app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# TLS: add a second server { listen 443 ssl; ... } block in a later phase
# (e.g. certbot). Keep HTTP→HTTPS redirect out of this template until certs exist.
